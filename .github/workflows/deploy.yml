# Test site: builds the website from its content, checks it, and publishes the
# preview version (drafts shown) to zafranzak98.github.io.
# A production build also runs and must pass: it proves drafts are excluded.
#
# Build guard: a push to main is published only if it changes content alone (content/,
# public/media/, public/files/), which is all the website editor can change, or if it is a pull
# request the site owner merged. Any other change stops here, before the build, and the website
# stays as it was. Running the workflow by hand from GitHub (workflow_dispatch) is allowed.
name: Build and deploy test site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow content changes and merged pull requests only
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "Started by hand: allowed."; exit 0; fi
          # 1. Content only (what the website editor saves): allowed straight away.
          other="unknown"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" "$SHA" | grep -vE '^(content/|public/media/|public/files/)' || true)
          fi
          if [ -z "$other" ]; then echo "Content only: allowed."; exit 0; fi
          # 2. Anything else must be a pull request the site owner merged into main. GitHub can take a few
          #    seconds to link a new merge to its pull request, so ask twice per try (the commit's linked
          #    pull requests, and recently merged pull requests whose merge commit is this one) and wait
          #    between tries, for up to about a minute.
          for try in 1 2 3 4 5 6; do
            linked=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
            if [ "$linked" -gt 0 ]; then echo "From a merged pull request: allowed."; exit 0; fi
            merged=$(gh api "repos/$REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=30" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\")] | length")
            if [ "$merged" -gt 0 ]; then echo "From a merged pull request: allowed."; exit 0; fi
            [ "$try" -lt 6 ] && sleep "${WAIT:-10}"
          done
          if [ "$other" = "unknown" ]; then
            echo "::error::Not published: cannot tell what this push changed. Merge it through a pull request."; exit 1
          fi
          {
            echo "### Not published: this push changes more than content"
            echo "Changes outside content/, public/media/ and public/files/ must come through a merged pull request."
            echo '```'; echo "$other"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Not published: files outside content were changed without a pull request: $(echo $other | tr '\n' ' ')"
          exit 1

  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Production build and checks (drafts must be excluded)
        run: bun run build
      - name: Preview build for the test site (drafts shown)
        id: preview
        run: rm -rf dist .content-collections && bun run build:preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Email a warning if a size limit is getting close
        if: steps.preview.outputs.warnings != ''
        uses: actions/github-script@v7
        env:
          WARNINGS: ${{ steps.preview.outputs.warnings }}
        with:
          script: |
            const title = 'Website size warning'
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open' })
            const body = process.env.WARNINGS + '\n\nFrom build ' + context.runId + '.'
            const existing = open.data.find(i => i.title === title)
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            else await github.rest.issues.create({ ...context.repo, title, body })

  deploy:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow content changes and merged pull requests only
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "Started by hand: allowed."; exit 0; fi
          # A merged pull request: GitHub links the commit on main to the pull request.
          merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$merged" -gt 0 ]; then echo "From a merged pull request: allowed."; exit 0; fi
          # Otherwise every changed file must be content. If the earlier commit is unknown, block.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "::error::Not published: cannot tell what this push changed. Merge it through a pull request." ; exit 1
          fi
          other=$(git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -vE '^(content/|public/media/|public/files/)' || true)
          if [ -n "$other" ]; then
            {
              echo "### Not published: this push changes more than content"
              echo "Changes outside content/, public/media/ and public/files/ must come through a merged pull request."
              echo '```'; echo "$other"; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Not published: files outside content were changed without a pull request: $(echo $other | tr '\n' ' ')"
            exit 1
          fi
          echo "Content only: allowed."

  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Production build and checks (drafts must be excluded)
        run: bun run build
      - name: Preview build for the test site (drafts shown)
        id: preview
        run: rm -rf dist .content-collections && bun run build:preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Email a warning if a size limit is getting close
        if: steps.preview.outputs.warnings != ''
        uses: actions/github-script@v7
        env:
          WARNINGS: ${{ steps.preview.outputs.warnings }}
        with:
          script: |
            const title = 'Website size warning'
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open' })
            const body = process.env.WARNINGS + '\n\nFrom build ' + context.runId + '.'
            const existing = open.data.find(i => i.title === title)
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            else await github.rest.issues.create({ ...context.repo, title, body })

  deploy:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
