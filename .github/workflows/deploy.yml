# Test site: builds the website from its content, checks it, and publishes the
# preview version (drafts shown) to zafranzak98.github.io.
# A production build also runs and must pass: it proves drafts are excluded.
#
# Build guard: compares main with the version the website was last published from (GitHub's
# deployment records). Publishing goes ahead only if everything since then is content (content/,
# public/media/, public/files/), which is all the website editor can change, or came through a pull
# request the site owner merged. Anything else stops here, before the build, and the website stays
# as it was. If the last published version cannot be read or verified, nothing is published (fail
# closed). Running the workflow by hand from GitHub (workflow_dispatch) publishes content and code from
# merged pull requests as usual; code changes that did not come through a merged pull request are
# published only if the "Publish code without a pull request" box is ticked, and are listed as warnings.
name: Build and deploy test site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_unapproved_code:
        description: 'Publish code without a pull request (tick only if a previous run asked for it)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      deployments: read # read-only: finds the version the website was last published from
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allow content changes and merged pull requests only
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.publish_unapproved_code }}
        run: |
          set -euo pipefail
          CONTENT='^(content/|public/media/|public/files/)'
          stop() { echo "::error::Not published: $1"; echo "### Not published" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # Is commit $1 part of a pull request merged into main? GitHub can take a few seconds to link a new
          # merge to its pull request, so ask twice per try and wait between tries, for up to about a minute.
          # A failed GitHub request counts as "not confirmed", never as approved.
          approved() {
            local try linked merged
            for try in 1 2 3 4 5 6; do
              linked=$(gh api "repos/$REPO/commits/$1/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' 2>/dev/null || echo 0)
              [ "${linked:-0}" -gt 0 ] 2>/dev/null && return 0
              merged=$(gh api "repos/$REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=30" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$1\")] | length" 2>/dev/null || echo 0)
              [ "${merged:-0}" -gt 0 ] 2>/dev/null && return 0
              [ "$try" -lt 6 ] && sleep "${WAIT:-10}"
            done
            return 1
          }
          # 1. The version the website was last published from: the newest github-pages deployment whose
          #    latest status is "success". Fail closed: if GitHub cannot answer, or no such version is found
          #    in the last 30 deployments, or it is not in main's history, nothing is published.
          list=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id) \(.sha)"') \
            || stop "GitHub's deployment records could not be read, so the live version cannot be checked. Run the workflow again later."
          BASE=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""') \
              || stop "A deployment status could not be read, so the live version cannot be checked. Run the workflow again later."
            if [ "$state" = "success" ]; then BASE=$sha; break; fi
          done <<< "$list"
          [ -n "$BASE" ] || stop "No successfully published version was found in GitHub's deployment records."
          git cat-file -e "$BASE^{commit}" 2>/dev/null || stop "The last published version ($BASE) is not in main's history."
          echo "Last published version: $BASE"
          # 2. Started by hand (Actions tab, Run workflow). Content and code from merged pull requests are
          #    published as usual. Code changes that did not come through a merged pull request are published
          #    only if the "Publish code without a pull request" box was ticked (input publish_unapproved_code,
          #    default false); otherwise the run stops and lists them. The checks above always run first.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            unapproved=""; details=""
            for c
