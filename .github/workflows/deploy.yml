# Test site: builds the website from its content, checks it, and publishes the
# preview version (drafts shown) to zafranzak98.github.io.
# A production build also runs and must pass: it proves drafts are excluded.
#
# Build guard: compares main with the version the website was last published from (GitHub's
# deployment records). Publishing goes ahead only if everything since then is content (content/,
# public/media/, public/files/), which is all the website editor can change, or came through a pull
# request the site owner merged. Anything else stops here, before the build, and the website stays
# as it was. If the last published version cannot be read or verified, nothing is published (fail
# closed). Running the workflow by hand from GitHub (workflow_dispatch) publishes content and code from
# merged pull requests as usual; code changes that did not come through a merged pull request are
# published only if the "Publish code without a pull request" box is ticked, and are listed as warnings.
name: Build and deploy test site

on:
  push:
    branches: [main]
  # Once a month the site is rebuilt from what is already published, so the security check
  # (inside the build) runs even when nothing has been edited. GitHub pauses this after 60 days
  # without any change to the repository.
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch:
    inputs:
      publish_unapproved_code:
        description: 'Publish code without a pull request (tick only if a previous run asked for it)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      deployments: read # read-only: finds the version the website was last published from
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # GitHub's key is not left on the build machine after checkout
      - name: Allow content changes and merged pull requests only
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CONFIRM: ${{ inputs.publish_unapproved_code }}
        run: |
          set -euo pipefail
          CONTENT='^(content/|public/media/|public/files/)'
          stop() { echo "::error::Not published: $1"; echo "### Not published" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          # Is commit $1 part of a pull request merged into main? GitHub can take a few seconds to link a new
          # merge to its pull request, so ask twice per try and wait between tries, for up to about a minute.
          # A failed GitHub request counts as "not confirmed", never as approved.
          approved() {
            local try linked merged
            for try in 1 2 3 4 5 6; do
              linked=$(gh api "repos/$REPO/commits/$1/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' 2>/dev/null || echo 0)
              [ "${linked:-0}" -gt 0 ] 2>/dev/null && return 0
              merged=$(gh api "repos/$REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=30" --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$1\")] | length" 2>/dev/null || echo 0)
              [ "${merged:-0}" -gt 0 ] 2>/dev/null && return 0
              [ "$try" -lt 6 ] && sleep "${WAIT:-10}"
            done
            return 1
          }
          # 1. The version the website was last published from: the newest github-pages deployment whose
          #    latest status is "success". Fail closed: if GitHub cannot answer, or no such version is found
          #    in the last 30 deployments, or it is not in main's history, nothing is published.
          list=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id) \(.sha)"') \
            || stop "GitHub's deployment records could not be read, so the live version cannot be checked. Run the workflow again later."
          BASE=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""') \
              || stop "A deployment status could not be read, so the live version cannot be checked. Run the workflow again later."
            if [ "$state" = "success" ]; then BASE=$sha; break; fi
          done <<< "$list"
          [ -n "$BASE" ] || stop "No successfully published version was found in GitHub's deployment records."
          git cat-file -e "$BASE^{commit}" 2>/dev/null || stop "The last published version ($BASE) is not in main's history."
          echo "Last published version: $BASE"
          # 2. Started by hand (Actions tab, Run workflow). Content and code from merged pull requests are
          #    published as usual. Code changes that did not come through a merged pull request are published
          #    only if the "Publish code without a pull request" box was ticked (input publish_unapproved_code,
          #    default false); otherwise the run stops and lists them. The checks above always run first.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            unapproved=""; details=""
            for c in $(git rev-list --reverse "$BASE..$SHA"); do
              f=$(git diff-tree --no-commit-id --name-only -r -m --first-parent "$c" | grep -vE "$CONTENT" || true)
              [ -z "$f" ] && continue
              approved "$c" && continue
              unapproved="$unapproved $c"
              details="$details- $c: $(printf '%s' "$f" | tr '\n' ' ')"$'\n'
            done
            if [ -z "$unapproved" ]; then echo "Started by hand; every code change came through a merged pull request: allowed."; exit 0; fi
            if [ "${CONFIRM:-false}" = "true" ]; then
              { echo "### Published by hand with confirmation"; echo "Code changes that did not come through a merged pull request:"; printf '%s' "$details"; } >> "$GITHUB_STEP_SUMMARY"
              for c in $unapproved; do echo "::warning::Published by hand with confirmation, including a code change without a pull request: $c"; done
              echo "Started by hand with the confirmation box ticked: allowed."; exit 0
            fi
            { echo "### Not published: confirmation needed"; echo "Code changes that did not come through a merged pull request:"; printf '%s' "$details"; echo "To publish them anyway, run the workflow again and tick \"Publish code without a pull request\"."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Not published: code changes without a merged pull request, and the confirmation box was not ticked:$unapproved"
            exit 1
          fi
          # 3. The published version itself or an earlier one (a re-run or rollback): allowed.
          if git merge-base --is-ancestor "$SHA" "$BASE"; then echo "Already published or an earlier version: allowed."; exit 0; fi
          # 4. Since the live version, only content changed overall (including mistakes that were reverted): allowed.
          net=$(git diff --name-only "$BASE" "$SHA" | grep -vE "$CONTENT" || true)
          if [ -z "$net" ]; then echo "Only content changed since the live version: allowed."; exit 0; fi
          # 5. Otherwise every commit since the live version that changes files outside content must come from
          #    a pull request merged into main.
          bad=""
          for c in $(git rev-list --reverse "$BASE..$SHA"); do
            files=$(git diff-tree --no-commit-id --name-only -r -m --first-parent "$c" | grep -vE "$CONTENT" || true)
            [ -z "$files" ] && continue
            approved "$c" || bad="$bad $c"
          done
          [ -z "$bad" ] && { echo "All code changes since the live version came through merged pull requests: allowed."; exit 0; }
          stop "code changes without a merged pull request since the live version:$bad"

  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # GitHub's key is not left on the build machine after checkout
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      -       - name: Production build and checks (drafts must be excluded)
        id: build
        run: bun run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true # keeps .nojekyll, so the published files stay exactly as before
      - name: Email a warning when something needs attention (only when it changes)
        if: steps.preview.outputs.warnings != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WARNINGS: ${{ steps.preview.outputs.warnings }}
        with:
          script: |
            const title = 'Website warnings'
            const text = process.env.WARNINGS.trim()
            const stamp = '\n\nFrom build ' + context.runId + '.'
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open' })
            const existing = open.data.find(i => i.title === title)
            if (!existing) return github.rest.issues.create({ ...context.repo, title, body: text + stamp })
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: existing.number })
            const last = (comments.length ? comments[comments.length - 1].body : existing.body).split('\n\nFrom build')[0].trim()
            if (last === text) return core.info('Same warnings as the last report, so no new email.')
            await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: text + stamp })

  deploy:
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
