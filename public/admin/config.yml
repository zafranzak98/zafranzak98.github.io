# Website editor (Sveltia CMS). The field names and allowed values here must match
# content-collections.ts: the build checks every saved file against that schema and
# stops, leaving the website as it was, if anything does not fit.

backend:
  name: github
  repo: zafranzak98/zafranzak98.github.io
  branch: main
  # "Sign in with GitHub" through the Sveltia CMS Authenticator on Zafran's own Cloudflare
  # account. It uses a GitHub App installed on this repository only (Contents read and write).
  # Sign-ins last 8 hours and renew themselves through the Worker with a renewal key kept in
  # the browser; signing in again is needed after about six months without use. Signing out
  # does not cancel a sign-in at GitHub: revoke the app there for that. The token method stays off.
  base_url: https://sveltia-cms-auth.zafranzak98.workers.dev
  auth_methods: [oauth]
  commit_messages:
    create: 'Website editor: add {{collection}} "{{slug}}"'
    update: 'Website editor: update {{collection}} "{{slug}}"'
    delete: 'Website editor: delete {{collection}} "{{slug}}"'
    uploadMedia: 'Website editor: upload "{{path}}"'
    deleteMedia: 'Website editor: delete "{{path}}"'

app_title: Website editor · Zafran Zakaria
logo:
  src: /apple-touch-icon.png
show_preview_links: true
site_url: https://zafranzak98.github.io
display_url: https://zafranzak98.github.io

media_folder: public/media
public_folder: /media
media_libraries:
  default:
    config:
      max_file_size: 26214400
      slugify_filename: true
      # Photos are converted to WebP and scaled down to fit within 2400 x 2400 pixels when
      # uploaded, so a phone photo or a tall export at full size never slows the website down.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

# Web addresses use plain letters, numbers and hyphens only.
slug:
  encoding: ascii

output:
  omit_empty_optional_fields: true

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: >-
      Every project on the website. Drafts appear only on this test website, never on
      zafranzakaria.com. Changes go live about two minutes after you press Save.
    folder: content/projects
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{title}} · {{status}} · {{page_type}}'
    media_folder: '/public/media/projects/{{slug}}'
    public_folder: '/media/projects/{{slug}}'
    sortable_fields: [title, order, status, year]
    view_groups:
      - { name: status, label: Status, field: status }
      - { name: category, label: Category, field: category }
    view_filters:
      - { name: drafts, label: Drafts, field: status, pattern: Draft }
      - { name: published, label: Published, field: status, pattern: Published }
    thumbnail: cover.image
    fields:
      # ---- Basics
      - name: title
        label: Title
        widget: string
        maxlength: 60
        hint: The project name. The page's web address follows it, unless Web address below is filled in.
      - name: url
        label: Web address
        widget: string
        required: false
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use lowercase letters and numbers, with single hyphens between words if you want them, for example bersihmalaysia or af-binary.']
        hint: 'Usually leave this empty: the address is made from the title (AF-Binary becomes af-binary) and follows any rename. Fill it in only to choose a different address; it then stays the same when the title changes. Old addresses always keep working.'
      - name: status
        label: Status
        widget: select
        options: [Draft, Published]
        default: Draft
        hint: Draft shows the project on this test website only. Published also puts it on zafranzakaria.com.
      - name: page_type
        label: Page type
        widget: select
        options: [Full case study, Listed only]
        default: Full case study
        hint: A full case study has its own page. Listed only appears in the project lists without a page.
      - name: category
        label: Category
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        search_fields: [name]
        display_fields: [name]
      - name: summary
        label: Summary
        widget: text
        maxlength: 220
        hint: 'One or two sentences shown in project lists and at the top of the page. Wrap words in *single asterisks* to make them bold.'

      # ---- Homepage and order
      - name: featured
        label: Show on the homepage
        widget: boolean
        default: false
        required: false
        hint: Only full case studies can appear on the homepage.
      - name: homepage_label
        label: Homepage line
        widget: string
        maxlength: 70
        required: false
        hint: Short line under the title on the homepage, for example "Team Leader, student agency". Leave empty to use your role.
      - name: order
        label: Order
        widget: number
        value_type: int
        required: false
        hint: Lower numbers come first on category pages. On the All projects page, projects are shown newest Year first, and this number orders projects from the same year. Projects without a number come last, in alphabetical order.

      # ---- Opening
      - name: opening_colour
        label: Opening colour
        widget: select
        options: [Olive, Sage, Light sage, Off-white, Terracotta]
        default: Olive
        hint: The project's preferred colour, for its band on the Projects pages and the opening of its case study. If it would match or look too close to a neighbouring project, the website automatically shows the nearest distinct colour from the palette instead, the same on every page.
      - name: cover
        label: Cover image
        widget: object
        required: false
        fields: &image
          - { name: image, label: Image, widget: image, required: false }
          - { name: alt, label: Image description, widget: string, required: false, hint: Describe the image for people who cannot see it. }
          - { name: caption, label: Caption, widget: string, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
      - name: cover_before
        label: Before image
        widget: object
        required: false
        hint: For rebrands only. Shown beside the cover as the "before".
        fields: *image

      # ---- Project facts
      - { name: role, label: Your role, widget: string, maxlength: 60 }
      - name: project_type
        label: Project type
        widget: select
        options: [Individual project, Team project (lead), Team project (member), Freelance, University project, Personal project]
      - { name: type_detail, label: Project type detail, widget: string, required: false, hint: 'For example "team of five, student agency module".' }
      - { name: when, label: When, widget: string, hint: 'For example "Sep–Dec 2023".' }
      - { name: year, label: Year, widget: number, value_type: int, required: false, hint: Sets the order on the All projects page (newest first) and shows on the homepage. }
      - { name: deliverables, label: Deliverables, widget: list, required: false, hint: One per line. }
      - { name: tools, label: Tools, widget: list, required: false, hint: One per line. }

      # ---- The story
      - { name: objective, label: Objective, widget: text, required: false, hint: 'Wrap words in **double asterisks** to highlight them, or *single asterisks* to make them bold.' }
      - { name: what_i_did, label: What I did, widget: text, required: false, hint: 'Wrap words in **double asterisks** to highlight them, or *single asterisks* to make them bold.' }
      - { name: what_team_did, label: What the team delivered, widget: text, required: false, hint: 'For team projects. Wrap words in **double asterisks** to highlight them, or *single asterisks* to make them bold.' }
      - name: research
        label: Research
        widget: object
        required: false
        fields:
          - name: stats
            label: Research figures
            widget: list
            required: false
            max: 4
            fields: &figure
              - { name: figure, label: Figure, widget: string, maxlength: 12, hint: 'The number or short value only, for example "50+", "20%" or "First-Class". Put any words in Label.' }
              - { name: label, label: Label, widget: string, hint: 'Wrap words in *single asterisks* to make them bold.' }
          - { name: text, label: What you found, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
          - { name: extra, label: More detail, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
          - { name: moodboard, label: Moodboard, widget: object, required: false, fields: *image }

      # ---- The work
      - { name: key_piece, label: Key piece, widget: object, required: false, hint: The main image of the work., fields: *image }
      - name: supporting
        label: Supporting images
        widget: list
        required: false
        max: 3
        collapsed: true
        fields: *image
      - { name: supporting_note, label: Supporting images note, widget: string, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
      - name: film
        label: Film
        widget: object
        required: false
        fields:
          - { name: url, label: Video link, widget: string, required: false, hint: A YouTube or Vimeo link. }
          - { name: caption, label: Caption, widget: string, required: false }
      - name: context
        label: In context
        widget: object
        required: false
        hint: An image of the work in use, with a short note.
        fields:
          - { name: image, label: Image, widget: image, required: false }
          - { name: alt, label: Image description, widget: string, required: false }
          - { name: text, label: Note, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
      - name: gallery
        label: Gallery
        widget: list
        required: false
        collapsed: true
        hint: Drag to reorder.
        fields: *image
      - { name: gallery_note, label: Gallery note, widget: string, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }

      # ---- Results
      - { name: results_label, label: Results heading, widget: string, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
      - { name: results, label: Results, widget: list, required: false, max: 4, fields: *figure }
      - { name: outcome_note, label: Outcome note, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
      - { name: skills, label: Skills shown, widget: list, required: false, hint: One per line. }
      - name: labels
        label: Section titles and labels
        widget: object
        required: false
        collapsed: true
        hint: Change the fixed words on this page. Leave a field empty to use the standard wording.
        fields:
          - { name: overview, label: 'Overview', widget: string, required: false, hint: 'Leave empty for "Overview".' }
          - { name: research, label: 'Research & thinking', widget: string, required: false, hint: 'Leave empty for "Research & thinking".' }
          - { name: work, label: 'The work', widget: string, required: false, hint: 'Leave empty for "The work".' }
          - { name: outcomes, label: 'Outcomes', widget: string, required: false, hint: 'Leave empty for "Outcomes".' }
          - { name: role, label: 'My role', widget: string, required: false, hint: 'Leave empty for "My role".' }
          - { name: type, label: 'Type', widget: string, required: false, hint: 'Leave empty for "Type".' }
          - { name: when, label: 'When', widget: string, required: false, hint: 'Leave empty for "When".' }
          - { name: deliverables, label: 'Deliverables', widget: string, required: false, hint: 'Leave empty for "Deliverables".' }
          - { name: tools, label: 'Tools', widget: string, required: false, hint: 'Leave empty for "Tools".' }
          - { name: what_i_did, label: 'What I did', widget: string, required: false, hint: 'Leave empty for "What I did".' }
          - { name: what_team_did, label: 'What the team did', widget: string, required: false, hint: 'Leave empty for "What the team did".' }
          - { name: skills, label: 'Skills shown', widget: string, required: false, hint: 'Leave empty for "Skills shown".' }
      - name: link
        label: External link
        widget: object
        required: false
        fields:
          - { name: label, label: Link text, widget: string }
          - { name: url, label: Web address, widget: string, type: url }

      # ---- Search and sharing
      - name: seo
        label: Search and sharing (optional)
        widget: object
        required: false
        hint: Leave empty to use the title, summary and cover image automatically.
        fields:
          - { name: title, label: Page title in search results, widget: string, required: false, maxlength: 60, hint: Defaults to the project title. }
          - { name: description, label: Description in search results, widget: text, required: false, maxlength: 160, hint: Defaults to the summary. }
          - { name: image, label: Image when shared, widget: image, required: false, hint: 'Defaults to the cover image. Shown when the page is shared on LinkedIn, WhatsApp and similar.' }

      # Chosen with Zafran's approval only: selects a bespoke page design. Kept as it is when you edit.
      - { name: design, widget: hidden }

  - name: categories
    label: Categories
    label_singular: Category
    description: Groups of projects, each with its own page. To remove one, ask for help, so no project is left without a category.
    folder: content/categories
    extension: md
    format: frontmatter
    create: true
    delete: false
    slug: '{{name}}'
    identifier_field: name
    sortable_fields: [name, order]
    fields:
      - { name: name, label: Name, widget: string, maxlength: 40 }
      - { name: intro, label: Introduction, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
      - { name: order, label: Order, widget: number, value_type: int, required: false, hint: Lower numbers come first. }

  - name: pages
    label: About and site settings
    files:
      - name: about
        label: About page
        file: content/about.md
        format: frontmatter
        media_folder: /public/media/about
        public_folder: /media/about
        fields:
          - { name: intro, label: Introduction, widget: text, hint: 'Wrap words in **double asterisks** to highlight them, or *single asterisks* to make them bold.' }
          - { name: intro_more, label: More about you, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
          - { name: languages, label: Languages, widget: list, required: false }
          - name: portrait
            label: Portrait
            widget: object
            required: false
            fields:
              - { name: image, label: Image, widget: image, required: false }
              - { name: alt, label: Image description, widget: string, required: false }
          - { name: portrait_caption, label: Portrait caption, widget: string, required: false }
          - name: skills
            label: Skills
            widget: list
            required: false
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: Skill, widget: string }
              - { name: text, label: Description, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
          - name: education
            label: Education
            widget: list
            required: false
            summary: '{{fields.qualification}} {{fields.course}}'
            fields:
              - { name: qualification, label: Qualification, widget: string }
              - { name: course, label: Course, widget: string, required: false }
              - { name: institution, label: Institution, widget: string, required: false }
              - { name: years, label: Years, widget: string, required: false }
              - { name: result, label: Result, widget: string, required: false }
              - { name: note, label: Note, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
          - name: experience
            label: Experience
            widget: list
            required: false
            summary: '{{fields.years}} · {{fields.role}}'
            fields:
              - { name: years, label: Years, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: organisation, label: Organisation, widget: string, required: false }
              - { name: note, label: Note, widget: string, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }

      - name: site
        label: Site settings
        file: content/site.yml
        format: yaml
        fields:
          - { name: site_title, label: Website title, widget: string, hint: Shown in the browser tab on the homepage. }
          - { name: name, label: Your name, widget: string }
          - { name: home_intro, label: Homepage introduction, widget: text, hint: 'Wrap words in **double asterisks** to highlight them, or *single asterisks* to make them bold.' }
          - name: areas_of_focus
            label: Areas of focus
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: label, label: Label, widget: string }
              - name: category
                label: Links to category
                widget: relation
                required: false
                collection: categories
                value_field: '{{slug}}'
                search_fields: [name]
                display_fields: [name]
          - { name: projects_intro, label: Projects page introduction, widget: text, required: false, hint: 'Wrap words in *single asterisks* to make them bold.' }
          - { name: availability, label: Availability line, widget: string, required: false, hint: 'Shown under the homepage introduction, before the CV links, for example "Open to junior roles across the UK". Leave empty to hide it.' }
          - name: clock
            label: Homepage clock
            widget: object
            required: false
            hint: The local time shown beside the homepage introduction. It follows daylight saving automatically.
            fields:
              - { name: show, label: Show the clock, widget: boolean, default: true, required: false }
              - { name: city, label: City, widget: string, hint: 'The place named after the time, for example Harrogate.' }
              - name: time_zone
                label: Time zone
                widget: string
                pattern: ['^[A-Za-z_]+(/[A-Za-z0-9_+-]+)+$', 'Use a time zone name such as Europe/London or Asia/Kuala_Lumpur.']
                hint: 'The time zone of that city, for example Europe/London, Europe/Paris, America/New_York or Asia/Kuala_Lumpur. The website checks it before publishing.'
              - { name: line, label: Line under the time, widget: string, required: false, hint: 'For example "A mind full of ideas, always." Leave empty for none.' }
              - { name: weather, label: Show the weather, widget: boolean, default: false, required: false, hint: 'Shows the current temperature and a small weather icon after the time. The weather comes from Open-Meteo, a free service, and is credited in the footer. If the service does not answer, the weather is simply left out and the clock carries on.' }
              - { name: latitude, label: Latitude of the city, widget: number, value_type: float, min: -90, max: 90, required: false, hint: 'Where the weather is taken from, so it follows the city of the clock. For Harrogate it is 53.9921. You can find a place''s latitude and longitude on open-meteo.com or on a map. Change both numbers when you change the city.' }
              - { name: longitude, label: Longitude of the city, widget: number, value_type: float, min: -180, max: 180, required: false, hint: 'For Harrogate it is -1.5418. Places west of Greenwich, in London, have a minus sign.' }
          - name: cv
            label: CV (PDF)
            widget: file
            required: false
            accept: application/pdf
            media_folder: /public/files
            public_folder: /files
          - { name: email, label: Email, widget: string, type: email }
          - { name: instagram, label: Instagram link, widget: string, type: url, required: false }
          - { name: linkedin, label: LinkedIn link, widget: string, type: url, required: false }
          - { name: credit_name, label: Website credit name, widget: string, required: false }
          - { name: credit_url, label: Website credit link, widget: string, type: url, required: false }
